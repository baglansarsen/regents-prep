<link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:var(--font-body);color:var(--ink)}
.pad{padding:20px 22px}
.sw-row{display:flex;gap:12px;flex-wrap:wrap}
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--line);width:124px}
.sw .chip{height:64px}
.sw .m{padding:8px 10px}
.sw .n{font-family:var(--font-display);font-weight:600;font-size:13px}
.sw .h{font-weight:800;font-size:11px;color:var(--slate);letter-spacing:.02em}
.sw .u{font-size:10.5px;color:var(--slate);margin-top:1px}
.row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px dashed var(--line)}.tag{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--forest);width:108px;flex:none;letter-spacing:.04em}.d{font-family:var(--font-display)}</style>
<div class="pad">
<div class="row"><span class="tag">DISPLAY / 48</span><span class="d" style="font-size:34px">Pass with confidence</span></div>
<div class="row"><span class="tag">H1 / 32</span><span class="d" style="font-size:26px">Algebra II — Unit 3</span></div>
<div class="row"><span class="tag">H2 / 22</span><span class="d" style="font-size:19px">Today's challenge</span></div>
<div class="row"><span class="tag">BODY / 16</span><span style="font-size:16px">Break this one down together.</span></div>
<div class="row" style="border:none"><span class="tag">CAPTION / 13</span><span style="font-size:13px;color:var(--slate)">+15 XP · 4-day streak</span></div>

<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="8pt base" -->
<link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:var(--font-body);color:var(--ink)}
.pad{padding:20px 22px}
.sw-row{display:flex;gap:12px;flex-wrap:wrap}
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--line);width:124px}
.sw .chip{height:64px}
.sw .m{padding:8px 10px}
.sw .n{font-family:var(--font-display);font-weight:600;font-size:13px}
.sw .h{font-weight:800;font-size:11px;color:var(--slate);letter-spacing:.02em}
.sw .u{font-size:10.5px;color:var(--slate);margin-top:1px}
.sp{display:flex;flex-direction:column;gap:9px}.bar-row{display:flex;align-items:center;gap:12px}.bar{height:14px;background:var(--spark-green);border-radius:4px}.t{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--slate);width:74px}</style>
<div class="pad"><div class="sp">
<div class="bar-row"><span class="t">space-1</span><div class="bar" style="width:16px"></div><span class="t" style="width:auto">4px</span></div><div class="bar-row"><span class="t">space-2</span><div class="bar" style="width:32px"></div><span class="t" style="width:auto">8px</span></div><div class="bar-row"><span class="t">space-3</span><div class="bar" style="width:48px"></div><span class="t" style="width:auto">12px</span></div><div class="bar-row"><span class="t">space-4</span><div class="bar" style="width:64px"></div><span class="t" style="width:auto">16px</span></div><div class="bar-row"><span class="t">space-6</span><div class="bar" style="width:96px"></div><span class="t" style="width:auto">24px</span></div><div class="bar-row"><span class="t">space-8</span><div class="bar" style="width:128px"></div><span class="t" style="width:auto">32px</span></div>
</div></div>

<!-- @dsCard group="Spacing" viewport="700x190" name="Shadows & the Pop" subtitle="Soft card lift + signature button pop" -->
<link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:var(--font-body);color:var(--ink)}
.pad{padding:20px 22px}
.sw-row{display:flex;gap:12px;flex-wrap:wrap}
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--line);width:124px}
.sw .chip{height:64px}
.sw .m{padding:8px 10px}
.sw .n{font-family:var(--font-display);font-weight:600;font-size:13px}
.sw .h{font-weight:800;font-size:11px;color:var(--slate);letter-spacing:.02em}
.sw .u{font-size:10.5px;color:var(--slate);margin-top:1px}
.s-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.demo{width:150px;height:78px;background:#fff;border-radius:18px;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--slate)}.popbtn{font-family:var(--font-display);font-weight:600;border:none;border-radius:16px;padding:13px 24px;font-size:15px;color:#fff;background:var(--spark-green);box-shadow:var(--pop-green)}</style>
<div class="pad"><div class="s-row">
<div class="demo" style="box-shadow:var(--shadow-card)">card · 0 10px 30px</div>
<div class="demo" style="box-shadow:var(--shadow-float)">float · 0 14px 40px</div>
<button class="popbtn">Continue</button>
<div class="lab" style="font-family:var(--font-body);font-size:12px;color:var(--slate);max-width:150px">Buttons sit on a solid 5px offset — they press down 3px on tap.</div>
</div></div>
